name: Build D-Launcher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allows manual run from GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: runner.os != 'Windows'

      - name: Build (compile)
        run: ./gradlew :app:compileKotlin --stacktrace
        if: runner.os != 'Windows'

      - name: Build (compile) Windows
        run: .\gradlew.bat :app:compileKotlin --stacktrace
        if: runner.os == 'Windows'

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :app:packageDeb --stacktrace || ./gradlew :app:packageUberJarForCurrentOS --stacktrace

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: .\gradlew.bat :app:packageMsi --stacktrace || .\gradlew.bat :app:packageUberJarForCurrentOS --stacktrace

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: ./gradlew :app:packageDmg --stacktrace || ./gradlew :app:packageUberJarForCurrentOS --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d-launcher-${{ matrix.os }}
          path: |
            app/build/compose/binaries/
            app/build/libs/
          if-no-files-found: ignore
          retention-days: 14

  # Simple success job so you can see overall status
  success:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "All builds completed"
